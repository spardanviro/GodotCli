name: Release

# On a version tag (v1.2.3): check that the tag and the packages agree, attach
# the bridge as a zip for the Godot Asset Library to the GitHub release
# (made as a draft when there is none yet), and publish the CLI to npm.
#
# A tag is released only when its commit is on main and CI passed on it
# (the check job waits for that run). Every job works on the commit the check job resolved the tag to, so a tag
# moved in the meantime changes nothing. The npm package is packed and tested
# in the check job; the publishing job, the only one that can get an npm
# token, installs and runs nothing of the repository's: it uploads that file.
#
# npm publishing uses npm's trusted publishing (no token in the repository).
# It runs only once the repository variable NPM_PUBLISH is "true", which is
# set after the package exists on npm and this workflow is registered there
# as its trusted publisher, with the GitHub environment "npm"
# (docs/releasing.md). Until then publish by hand.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)build the release files for, e.g. v0.3.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: The input is a version tag
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error title=release::${TAG} is not a version tag (v1.2.3)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          # The whole history: whether the tag is on main is asked below.
          fetch-depth: 0
          # npm ci and the checks run the repository's scripts; they get no token.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - id: version
        name: The tag names the packages' version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./cli/package.json").version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error title=release::tag ${TAG} but the packages say ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: The tagged commit is on main and CI passed on it
        env:
          # Only this step has it; the later ones run the repository's code.
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error title=release::${TAG} (${SHA}) is not on main; push it to main first"
            exit 1
          fi
          # CI runs on every push to main; a tag pushed with its commit waits for that run.
          for _ in $(seq 1 90); do
            run="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${SHA}" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')"
            if [ -n "${run}" ] && [ "$(jq -r .status <<<"${run}")" = "completed" ]; then
              conclusion="$(jq -r .conclusion <<<"${run}")"
              if [ "${conclusion}" = "success" ]; then
                echo "CI passed: $(jq -r .url <<<"${run}")"
                exit 0
              fi
              echo "::error title=release::CI on ${SHA} ended ${conclusion}: $(jq -r .url <<<"${run}"). Re-run it, then re-run this release."
              exit 1
            fi
            sleep 30
          done
          echo "::error title=release::no finished CI run on ${SHA} after 45 minutes"
          exit 1
      # No install scripts of dependencies run in the job that builds what is published.
      - run: npm ci --ignore-scripts
      - run: npm run verify
      # Packs, installs and checks the package, and keeps that very tarball for the npm job.
      - run: npm run test:package -- --keep-tarball "${RUNNER_TEMP}/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          # Long enough to re-run only the npm job weeks later.
          retention-days: 90

  bridge-zip:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Zip the bridge the way the Asset Library installs it
        run: |
          set -euo pipefail
          # One top folder, inside it addons/gdcli: the installer drops the top folder.
          top="gdcli-bridge-${VERSION}"
          mkdir -p "${RUNNER_TEMP}/${top}/addons"
          cp -R bridge/addons/gdcli "${RUNNER_TEMP}/${top}/addons/gdcli"
          cp LICENSE "${RUNNER_TEMP}/${top}/addons/gdcli/LICENSE"
          (cd "${RUNNER_TEMP}" && zip -qr "${top}.zip" "${top}")
          echo "ZIP=${RUNNER_TEMP}/${top}.zip" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${top}.zip" >> "${GITHUB_ENV}"
      - name: Attach it to the release
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            # A version with a suffix (0.4.0-rc.1) is marked as a pre-release.
            prerelease=()
            case "${VERSION}" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "${TAG}" --draft --verify-tag "${prerelease[@]}" --title "${TAG}" --notes "Release notes to be written."
          fi
          # A published release's zip is what the Asset Library downloads: never replaced.
          draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          present="$(gh release view "${TAG}" --json assets --jq "[.assets[].name] | index(\"${ZIP_NAME}\") != null")"
          if [ "${draft}" != "true" ] && [ "${present}" = "true" ]; then
            echo "${ZIP_NAME} is already on the published release ${TAG}; left as it is."
            exit 0
          fi
          gh release upload "${TAG}" "${ZIP}" --clobber

  # The Claude plugin as a zip, for the Claude app's "Upload plugin" and for
  # claude --plugin-dir / --plugin-url: one top folder holding
  # .claude-plugin/plugin.json, the skills and the hooks.
  plugin-zip:
    # After bridge-zip, which creates the draft release when there is none.
    needs: [check, bridge-zip]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Zip the plugin
        run: |
          set -euo pipefail
          top="godot"
          mkdir -p "${RUNNER_TEMP}/${top}"
          # The plugin's own tests stay out: they are not part of the plugin.
          cp -R plugin/.claude-plugin plugin/hooks plugin/skills plugin/README.md plugin/sandbox-settings.example.json "${RUNNER_TEMP}/${top}/"
          cp LICENSE "${RUNNER_TEMP}/${top}/LICENSE"
          test -f "${RUNNER_TEMP}/${top}/.claude-plugin/plugin.json"
          name="gdcli-claude-plugin-${VERSION}.zip"
          (cd "${RUNNER_TEMP}" && zip -qr "${name}" "${top}")
          echo "ZIP=${RUNNER_TEMP}/${name}" >> "${GITHUB_ENV}"
          echo "ZIP_NAME=${name}" >> "${GITHUB_ENV}"
      - name: Attach it to the release
        run: |
          set -euo pipefail
          draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
          present="$(gh release view "${TAG}" --json assets --jq "[.assets[].name] | index(\"${ZIP_NAME}\") != null")"
          if [ "${draft}" != "true" ] && [ "${present}" = "true" ]; then
            echo "${ZIP_NAME} is already on the published release ${TAG}; left as it is."
            exit 0
          fi
          gh release upload "${TAG}" "${ZIP}" --clobber

  npm:
    needs: check
    # Only for a tag: the npm environment admits nothing else, so a manual run
    # from a branch skips this job instead of failing it.
    # And only for the tag the run started from: a manual run on tag A asked to
    # rebuild tag B must not publish B under A's workflow and environment.
    if: vars.NPM_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/') && (github.event.inputs.tag || github.ref_name) == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its protection rules (who may approve, which tags) are set in the repository's settings.
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # Pinned to commits, like every action here: what builds and publishes must not change under a moved tag.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm new enough for trusted publishing (11.5.1)
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package
      - name: Publish (skipped when this version is already on npm)
        run: |
          set -euo pipefail
          # Asked anonymously: npm view would send setup-node's placeholder token.
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@spardanviro/gdcli/${VERSION}")"
          case "${code}" in
            200) echo "@spardanviro/gdcli@${VERSION} is already on npm"; exit 0 ;;
            404) ;;
            *) echo "::error title=release::the registry answered ${code} for @spardanviro/gdcli@${VERSION}"; exit 1 ;;
          esac
          # npm names a scoped package's file <scope>-<name>-<version>.tgz.
          # "./": without it npm reads package/x.tgz as a GitHub repository (user/repo).
          tarball="./package/spardanviro-gdcli-${VERSION}.tgz"
          test -f "${tarball}"
          # A version with a suffix (0.4.0-rc.1) is not what npm install gdcli should get.
          case "${VERSION}" in
            *-*) npm publish "${tarball}" --provenance --access public --tag next ;;
            *) npm publish "${tarball}" --provenance --access public ;;
          esac
