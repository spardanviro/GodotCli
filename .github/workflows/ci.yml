name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: cli (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  bridge:
    name: bridge (godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.3-stable", "4.4-stable", "4.5-stable", "4.6-stable", "4.7-stable"]
    env:
      GODOT_TAG: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download Godot from the official release
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          archive="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "${archive}" "${base}/${archive}"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          # Same origin as the archive, so this catches a bad download, not a compromised release.
          grep " ${archive}\$" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip -q "${archive}" -d "${RUNNER_TEMP}/godot"
          echo "GODOT_BIN=${RUNNER_TEMP}/godot/Godot_v${GODOT_TAG}_linux.x86_64" >> "${GITHUB_ENV}"
      - run: node scripts/bridge-test.mjs
