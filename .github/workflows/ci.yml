name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request's runs share a group; on main each commit has its own, so a
  # newer push can neither cancel nor push out (from the queue) an older run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Only a pull request's older runs are cancelled. On main every commit keeps
  # its run: a release tag waits for the CI of its commit, and a push right
  # after the tag must not cancel it (0.3.1 and 0.3.2 failed that way).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: cli (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The task files are generated: one edited by hand, or a generator change
      # not run, would test something other than what make_tasks.py says.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: python3 evals/make_tasks.py && git diff --exit-code evals/tasks
      # What npm would publish, installed into an empty prefix and run.
      - run: npm run test:package

  # What only a game with a window shows: clicks at the positions game_ui gives,
  # through stretch and a SubViewport, and saved screenshots. A virtual display
  # (xvfb) with software OpenGL stands in for a screen.
  windowed:
    name: windowed (godot 4.7-stable, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_TAG: 4.7-stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: godot-download
          key: godot-4.7-stable-linux.x86_64.zip
      - name: Download Godot from the official release
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          archive="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          mkdir -p godot-download
          if [ ! -f "godot-download/${archive}" ]; then
            curl -fsSL --retry 3 -o "godot-download/${archive}" "${base}/${archive}"
          fi
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          (cd godot-download && grep " ${archive}\$" ../SHA512-SUMS.txt | sha512sum --check --strict -)
          unzip -q "godot-download/${archive}" -d "${RUNNER_TEMP}/godot"
          echo "GODOT_BIN=$(find "${RUNNER_TEMP}/godot" -type f -name '*_linux.x86_64' | head -n 1)" >> "${GITHUB_ENV}"
      - name: A virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a -s "-screen 0 1280x800x24" node scripts/windowed-test.mjs

  bridge:
    name: bridge (godot ${{ matrix.godot }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Every minor version on Linux; the newest on Windows, macOS and the .NET build.
        include:
          - { godot: 4.3-stable, os: ubuntu-latest, build: linux, archive: linux.x86_64.zip, binary: "*_linux.x86_64", evals: true }
          - { godot: 4.4-stable, os: ubuntu-latest, build: linux, archive: linux.x86_64.zip, binary: "*_linux.x86_64" }
          - { godot: 4.5-stable, os: ubuntu-latest, build: linux, archive: linux.x86_64.zip, binary: "*_linux.x86_64" }
          - { godot: 4.6-stable, os: ubuntu-latest, build: linux, archive: linux.x86_64.zip, binary: "*_linux.x86_64" }
          - { godot: 4.7-stable, os: ubuntu-latest, build: linux, archive: linux.x86_64.zip, binary: "*_linux.x86_64", evals: true }
          - { godot: 4.7-stable, os: ubuntu-latest, build: dotnet, archive: mono_linux_x86_64.zip, binary: "*_mono_linux.x86_64" }
          - { godot: 4.7-stable, os: windows-latest, build: windows, archive: win64.exe.zip, binary: "*_win64_console.exe" }
          - { godot: 4.7-stable, os: macos-latest, build: macos, archive: macos.universal.zip, binary: "Godot" }
    env:
      GODOT_TAG: ${{ matrix.godot }}
      ARCHIVE_SUFFIX: ${{ matrix.archive }}
      BINARY_NAME: ${{ matrix.binary }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # npm ci from the cache: a network hiccup there failed whole runs.
          cache: npm
      # The Godot download, once per version and build; still checked against its sums below.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: godot-download
          key: godot-${{ matrix.godot }}-${{ matrix.archive }}
      - name: Download Godot from the official release
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          archive="Godot_v${GODOT_TAG}_${ARCHIVE_SUFFIX}"
          mkdir -p godot-download
          if [ ! -f "godot-download/${archive}" ]; then
            curl -fsSL --retry 3 -o "godot-download/${archive}" "${base}/${archive}"
          fi
          cp "godot-download/${archive}" "${archive}"
          curl -fsSL --retry 3 -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          # Same origin as the archive, so this catches a bad download, not a compromised release.
          line="$(grep " ${archive}\$" SHA512-SUMS.txt)"
          if command -v sha512sum >/dev/null; then
            echo "${line}" | sha512sum --check --strict -
          else
            echo "${line}" | shasum -a 512 --check --strict -
          fi
          if command -v unzip >/dev/null; then
            unzip -q "${archive}" -d "${RUNNER_TEMP}/godot"
          else
            7z x -bd -o"${RUNNER_TEMP}/godot" "${archive}" >/dev/null
          fi
          binary="$(find "${RUNNER_TEMP}/godot" -type f -name "${BINARY_NAME}" | head -n 1)"
          test -n "${binary}"
          # Later steps run node directly, which wants a Windows path there.
          if command -v cygpath >/dev/null; then binary="$(cygpath -w "${binary}")"; fi
          echo "GODOT_BIN=${binary}" >> "${GITHUB_ENV}"
      - run: node scripts/bridge-test.mjs
      - run: npm ci
      - run: npm run build
      - run: node scripts/cli-e2e.mjs
      # Which C# code runs inside a .NET editor, and which C# writes the bridge holds back.
      - if: matrix.build == 'dotnet'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - if: matrix.build == 'dotnet'
        run: node scripts/dotnet-probe.mjs
      # The eval set without a model: every reference answer passes its checks,
      # and doing nothing fails them. Oldest and newest Godot on Linux only, for time.
      - if: matrix.evals
        run: node evals/run.mjs --jobs 3
      - if: matrix.evals
        run: node evals/run.mjs --agent idle --jobs 3
